[package]
name = "mario-backend"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/mario"
documentation = "https://github.com/raphamorim/mario#readme"
description = "Backend infrastructure for Mario terminal"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
tracing = { workspace = true }

# Most of the former dependencies (corcovado, copypasta, onig-based search,
# simd, image_rs, …) moved with the terminal core to `mario-vt`. What remains
# here is config loading + the sugarloaf renderer glue.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = "0.9.2"
base64 = { workspace = true }
regex = { workspace = true }
onig = { workspace = true }
dirs = "6.0.0"
serde = { workspace = true }
mario-graphics = { workspace = true, features = ["glyph"] }
mario-vt = { workspace = true }
sugarloaf = { workspace = true, optional = true }
url = { workspace = true }
# `wgpu` is only needed when the corresponding sugarloaf feature is on.
wgpu = { workspace = true, optional = true }
mario-window = { workspace = true, optional = true }

[features]
default = ["renderer", "wayland", "x11", "mario-window", "graphics"]
# The renderer (sugarloaf) backend. Off makes mario-backend a lean terminal
# core with no GPU/font-shaping deps — this is what `libmario` embeds.
renderer = ["dep:sugarloaf", "mario-vt/renderer"]
# Image (sixel/kitty/iTerm2) and glyph protocol decoding. On for the desktop
# frontend; off for lean headless embeds (libmario).
graphics = ["mario-vt/graphics"]
# Mario's window layer (mario-window, a winit fork). Pulls in the window types
# and bridges the core's WindowId to mario-window at the frontend boundary.
mario-window = ["dep:mario-window", "mario-vt/mario-window"]
x11 = ["mario-vt/x11"]
wayland = ["mario-vt/wayland"]
# Enable the wgpu backend in sugarloaf (needed on Windows where the
# native Vulkan/Metal backends aren't available, and as an opt-in for
# librashader CRT/scanline filters on Linux/macOS). Implies `renderer`.
wgpu = ["renderer", "dep:wgpu", "sugarloaf/wgpu", "mario-vt/wgpu"]
