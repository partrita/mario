# Cargo linker configuration for the mario workspace.
#
# Only Windows overrides the linker: lld-link.exe ships with the Rust
# toolchain and MSVC needs it for fast links. Linux and macOS keep the
# platform default linker (cc), because rustc asks cc for the native
# library search paths; when rust-lld or ld64.lld is invoked directly
# those paths are missing and linking fails with "unable to find -lc".

[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"

[target.aarch64-pc-windows-msvc]
linker = "lld-link.exe"

[build]
# Reuse the incremental cache across CI runs where possible.
incremental = true
