# Cargo linker configuration for the mario workspace.
#
# Faster linkers cut link time for the large crates (mario-vt,
# mario-backend, marioterm). rust-lld is bundled with the Rust toolchain
# so it works out of the box. On Linux, mold is even faster when installed
# (CI installs it via apt): set linker = "mold" per-target below.

[target.x86_64-unknown-linux-gnu]
linker = "rust-lld"

[target.aarch64-unknown-linux-gnu]
linker = "rust-lld"

[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"

[target.aarch64-pc-windows-msvc]
linker = "lld-link.exe"

[target.x86_64-apple-darwin]
linker = "ld64.lld"

[target.aarch64-apple-darwin]
linker = "ld64.lld"

[build]
# Reuse the incremental cache across CI runs where possible.
incremental = true
