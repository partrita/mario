name: Release

on:
  push:
    branches:
      - mario
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: mario-x86_64-unknown-linux-gnu.tar.gz
            binary: target/x86_64-unknown-linux-gnu/release/mario

          # Linux aarch64 (native GitHub ARM runner)
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: mario-aarch64-unknown-linux-gnu.tar.gz
            binary: target/aarch64-unknown-linux-gnu/release/mario

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mario-aarch64-apple-darwin.tar.gz
            binary: target/aarch64-apple-darwin/release/mario

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: mario-x86_64-apple-darwin.tar.gz
            binary: target/x86_64-apple-darwin/release/mario

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mario-x86_64-pc-windows-msvc.zip
            binary: target/x86_64-pc-windows-msvc/release/mario.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev pkg-config libfontconfig1-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev glslang-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target installed via rustup (macOS & Windows)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: rustup target add ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p marioterm

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf ${{ matrix.artifact_name }} -C $(dirname ${{ matrix.binary }}) $(basename ${{ matrix.binary }})

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a ${{ matrix.artifact_name }} ./${{ matrix.binary }}

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
