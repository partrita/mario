name: Test

on:
  push:
    branches: [mario]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [mario]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Incremental compilation is disabled in CI so every job starts from a clean
  # profile and cache keys are stable across runs.
  CARGO_INCREMENTAL: 0
  # Line-level debug info is dead weight in CI: it multiplies target-dir
  # size, which is what cache upload/download and the 10GB repo cache
  # eviction actually pay for. Backtraces keep function names.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_NET_RETRY: 10

jobs:
  test-native:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        # Rust cache covers both the registry and the target directory so
        # unchanged crates are not recompiled across runs.
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -yq && sudo apt-get install -yq libasound2-dev libfontconfig1-dev glslang-tools

      - run: cargo fetch

      - name: cargo fmt
        # Formatting is platform-independent; once is enough.
        if: runner.os == 'Linux'
        run: cargo fmt -- --check --color always

      - run: cargo clippy --all-targets --all-features

      - name: cargo test (parallel, with timings)
        # --timings records per-crate duration so we can spot slow tests;
        # libtest already runs tests on all logical CPUs by default.
        run: cargo test --features wgpu --timings ${{ runner.os == 'Linux' && '' || '--no-default-features' }}

      - name: Upload build timings
        # One HTML per run showing which crates dominated and whether the
        # cache actually hit; download it when CI feels slow.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.os }}
          path: target/cargo-timings/
          if-no-files-found: ignore

  msys2-build-test: #cargo test doesn't necessarily build the exec we want
    # PR-only smoke of the modern default flavor; the full 3-flavor
    # release-profile matrix runs as a gate in release.yml instead of
    # on every main push.
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        sys: [UCRT64]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        # Reuse the MSYS2 preinstalled on the runner image instead of
        # downloading a fresh one, and skip the full pacman system
        # upgrade: the snapshot is fresh enough for a build check.
        release: false
        update: false
        install: base-devel git
        pacboy: >-
          rust:p
          cc:p
          pkgconf:p
          cmake:p
          freetype:p
          python:p
          fontconfig:p

    - name: Cache target dir
      uses: actions/cache@v4
      with:
        path: target
        key: msys2-${{ matrix.sys }}-smoke-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: msys2-${{ matrix.sys }}-smoke-

    - name: Build (smoke)
      shell: msys2 {0}
      # Debug is not viable on windows-gnu: an unoptimized build of a
      # binary this size exceeds the PE export-ordinal limit at link
      # time. Thin LTO keeps the dead-stripping that makes the link
      # possible without fat LTO's cost; the release flavor matrix in
      # release.yml still exercises the full shipped profile.
      env:
        CARGO_PROFILE_RELEASE_LTO: thin
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
        CARGO_PROFILE_RELEASE_DEBUG: "0"
      run: cargo build -p marioterm --release --features wgpu
