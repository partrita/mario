name: libmario

on:
  push:
    branches: [main]
    paths:
      - 'libmario/**'
      - 'mario-vt/**'
      - 'teletypewriter/**'
      - '.github/workflows/libmario.yml'
  pull_request:
    paths:
      - 'libmario/**'
      - 'mario-vt/**'
      - 'teletypewriter/**'
      - '.github/workflows/libmario.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  libmario:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test -p libmario
      - run: make libmamario-ctest
      - run: make libmamario-xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: MarioKit.xcframework
          path: target/libmario/MarioKit.xcframework
          if-no-files-found: error
