[workspace]
members = [
    "sugarloaf",
    "teletypewriter",
    "corcovado",
    "mario-graphics",
    "mario-fonts",
    "mario-vt",
    "mario-backend",
    "mario-grapheme-width",
    "mario-unicode",
    "mario-window",
    "mario-notifier",
    "mario-grid",
    "frontends/marioterm",
    "libmario",
    "libmario-wasm",
    "libsugarloaf",
]
resolver = "2"

[workspace.package]
version = "0.5.29"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
edition = "2021"
license = "MIT"
keywords = ["graphics", "terminal", "application"]
rust-version = "1.96.1"
repository = "https://github.com/partrita/mario"
homepage = "https://marioterm.com"
documentation = "https://github.com/partrita/mario#readme"
readme = "README.md"

[workspace.dependencies]
teletypewriter = { path = "teletypewriter", version = "0.5.29" }
mario-backend = { path = "mario-backend", version = "0.5.29" }
mario-window = { path = "mario-window", version = "0.5.29", default-features = false }
mario-notifier = { path = "mario-notifier", version = "0.5.29" }
mario-grapheme-width = { path = "mario-grapheme-width", version = "0.5.29" }
sugarloaf = { path = "sugarloaf", version = "0.5.29" }
corcovado = { path = "corcovado", version = "0.5.29" }
mario-graphics = { path = "mario-graphics", version = "0.5.29" }
mario-fonts = { path = "mario-fonts", version = "0.5.29" }
mario-vt = { path = "mario-vt", version = "0.5.29" }
mario-grid = { path = "mario-grid", version = "0.5.29" }
mario-unicode = { path = "mario-unicode", version = "0.5.29" }

raw-window-handle = { version = "0.6.2", features = ["std"] }
parking_lot = { version = "0.12.5", features = [
    "nightly",
    "hardware-lock-elision",
] }
rustc-hash = "2.1.3"
smallvec = { version = "1.15.2", default-features = false }
simdutf = "0.7.0"
base64 = "0.23.0"
image_rs = { package = "image", version = "0.25.10", default-features = false, features = [
    "jpeg",
    "ico",
    "png",
    "webp",
] }
regex = "1.12.3"
onig = { version = "6.5.3", default-features = false }
onig_sys = { version = "69.9.3", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "30.0.1"
libc = "0.2.189"
smol_str = "0.3.2"
futures = "0.3.31"
zbus = "4.4.0"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.4.34"
wasm-bindgen-test = "0.3.42"
env_logger = "0.11.8"
console_log = "0.2.2"
bitflags = "2.9.0"
console_error_panic_hook = "0.1.7"
tracing = "0.1.41"
objc = { package = "objc-rs", version = "0.3.2" }
memmap2 = "0.9.11"
url = "2.5.4"
criterion = { version = "0.6.0", features = ["html_reports"] }
dashmap = "6.2.1"
flate2 = "1.1.9"
miniz_oxide = "0.8"

[profile.release]
opt-level = "s"                 # optimize for binary size
lto = "fat"                     # fat LTO for cross-crate dead code elimination
codegen-units = 1               # single codegen unit for maximum optimization
panic = "abort"                 # strip unwinding tables
strip = "symbols"               # strip symbol tables
debug = false
incremental = false

[profile.libmario]
inherits = "release"
strip = "none"
debug = false
lto = false

[profile.dev]
split-debuginfo = "unpacked"
lto = false
opt-level = 0
incremental = true